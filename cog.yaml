# Configuration for Cog ⚙️
# Reference: https://cog.run/yaml

build:
  gpu: true
  cuda: "12.1"

  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0"

  python_version: "3.10"

  python_requirements: "requirements.txt"

  run:
    - python -m pip install --upgrade pip
    - pip install --no-cache-dir diffusers[torch]==0.27.2 transformers==4.36.2 huggingface-hub==0.23.0 accelerate
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/download/v0.8.1/pget_linux_x86_64"
    - chmod +x /usr/local/bin/pget
    - echo "Replicate build cache breaker $(date)"

predict: "predict.py:Predictor"
